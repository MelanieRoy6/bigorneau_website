<div class="bp" id="top">
<div class="ed-page">

  <header class="ed-header">
    <p class="mono" style="color:var(--accent)">Dans les archives</p>
    <h1 class="disp ed-title">Édition {{ editionNum }}</h1>
  </header>

  @if (photos.length) {
    <div class="ed-grid">
      @for (photo of photos; track photo.src) {
        <div class="ed-frame ed-frame--photo">
          <img [src]="photo.src" [alt]="photo.alt">
        </div>
      }
    </div>
  } @else {
    <p class="ed-soon mono">Photos à venir — reste à l'écoute 🐚</p>
  }

  <a routerLink="/" class="btn" style="margin-top:48px;display:inline-flex">
    <svg class="arr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Retour à l'accueil
  </a>

</div>
</div>
