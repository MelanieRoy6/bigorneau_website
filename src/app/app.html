<router-outlet />

<audio id="bg-audio" loop src="La%20crique%20aux%20bigorneaux.mp3" preload="none"></audio>

<button class="audio-btn" [class.audio-btn--bottom]="isOrga" (click)="audio.toggle()" [attr.aria-label]="audio.isPlaying ? 'Couper la musique' : 'Lancer la musique'">
  @if (audio.isPlaying) {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </svg>
  } @else {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/>
      <line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
  }
</button>
